<h2>Course Listing</h2>

<input [(ngModel)]="searchTerm" (ngModelChange)="onSearchChange()" placeholder="Search courses (updates URL query param)" />

<p *ngIf="loading$ | async">Loading courses...</p>
<p class="error" *ngIf="error$ | async as err">{{ err }}</p>

<div class="grid" *ngIf="(courses$ | async) as courses">
  <ng-container *ngIf="courses.length > 0; else noCourses">
    <div *ngFor="let course of courses; trackBy: trackByCourseId" (click)="goToCourse(course.id)">
      <app-course-card [course]="course"></app-course-card>
    </div>
  </ng-container>
  <ng-template #noCourses>
    <p>No courses available.</p>
  </ng-template>
</div>
